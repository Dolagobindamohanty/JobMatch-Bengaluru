services:
  - type: web
    name: jobmatch-bengaluru-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: JOBMATCH_RESUME_DIR
        value: /tmp/jobmatch-resumes

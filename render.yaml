services:
  - type: web
    name: jobmatch-bengaluru-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jobmatch-bengaluru-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: REFRESH_ON_STARTUP
        value: "false"
      - key: JOBMATCH_RESUME_DIR
        value: /tmp/jobmatch-resumes
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  # The web service and cron intentionally receive the same PostgreSQL
  # connection string, so refreshes are immediately visible to the API.
  - type: cron
    name: jobmatch-bengaluru-refresh
    runtime: python
    rootDir: .
    schedule: "0 */6 * * *"
    buildCommand: pip install -r api/requirements.txt
    startCommand: python blr_jobs_pipeline.py --config companies.json
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jobmatch-bengaluru-db
          property: connectionString
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: jobmatch-bengaluru-db
    databaseName: jobmatch
    user: jobmatch

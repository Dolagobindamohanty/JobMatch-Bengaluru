services:
  - type: web
    name: jobmatch-bengaluru-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jobmatch-bengaluru-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: REFRESH_ON_STARTUP
        value: "false"
      - key: JOBMATCH_RESUME_DIR
        value: /tmp/jobmatch-resumes

  # Keep collection work out of the web process.  Set JOBMATCH_DB_PATH to a
  # shared persistent location only while the collector is SQLite-backed; the
  # PostgreSQL migration should replace this command before production data is
  # moved off SQLite.
  - type: cron
    name: jobmatch-bengaluru-refresh
    runtime: python
    rootDir: .
    schedule: "0 */6 * * *"
    buildCommand: pip install -r api/requirements.txt
    startCommand: python blr_jobs_pipeline.py --config companies.json

databases:
  - name: jobmatch-bengaluru-db
    databaseName: jobmatch
    user: jobmatch

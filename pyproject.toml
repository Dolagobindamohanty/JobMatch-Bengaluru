[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobmatch-bengaluru"
version = "0.1.0"
description = "Bengaluru IT and AI jobs pipeline"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "huggingface_hub>=0.32", "fastembed>=0.7"]

[project.optional-dependencies]
postgres = ["SQLAlchemy>=2.0", "psycopg[binary]>=3.2", "alembic>=1.14"]
s3 = ["boto3>=1.34"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["jobmatch_bengaluru*"]
